apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: task-management
  labels:
    app: user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          # Replace <github-owner> and <tag> with a real commit-SHA tag
          # produced by .github/workflows/docker.yml (see README). Never use
          # ":latest" - always pin to an immutable commit SHA.
          image: ghcr.io/md-sadeedkhan/task-management-user-service:a2d7352bc7abf0a534ba92def08bb50d83e55ef8
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: user-service-config
            - secretRef:
                name: user-postgres-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "150m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
