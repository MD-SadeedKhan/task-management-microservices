# NOTE (learning project): credentials are provided here in plain stringData
# for readability. Kubernetes stores Secret values base64-encoded (NOT
# encrypted) at rest by default, so treat this file as sensitive, never
# commit real credentials to source control, and enable encryption at rest
# and/or a secrets manager (e.g. Sealed Secrets, Vault, cloud KMS) for any
# real deployment.
apiVersion: v1
kind: Secret
metadata:
  name: user-postgres-secret
  namespace: task-management
  labels:
    app: user-postgres
type: Opaque
stringData:
  POSTGRES_DB: "userdb"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  DB_USERNAME: "postgres"
  DB_PASSWORD: "postgres"
---
apiVersion: v1
kind: Secret
metadata:
  name: task-postgres-secret
  namespace: task-management
  labels:
    app: task-postgres
type: Opaque
stringData:
  POSTGRES_DB: "taskdb"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  DB_USERNAME: "postgres"
  DB_PASSWORD: "postgres"
