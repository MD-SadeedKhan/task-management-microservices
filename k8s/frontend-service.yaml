# Exposed as a LoadBalancer so the UI is reachable from outside the
# cluster. On a local cluster (kind/minikube) without a real cloud load
# balancer, the EXTERNAL-IP will stay <pending> - use
# `kubectl port-forward` or `minikube tunnel` instead (see README).
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: task-management
  labels:
    app: frontend
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
