name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            image: task-management-gateway
          - service: user-service
            image: task-management-user-service
          - service: task-service
            image: task-management-task-service
          - service: frontend
            image: task-management-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.image }}:${{ github.sha }}

  update-manifests:
    name: Update Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase image owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Update image tags
        run: |
          OWNER="${{ steps.owner.outputs.name }}"
          SHA="${{ github.sha }}"

          sed -i "s|ghcr.io/<github-owner>/task-management-gateway:<tag>|ghcr.io/${OWNER}/task-management-gateway:${SHA}|g" k8s/gateway-deployment.yaml

          sed -i "s|ghcr.io/<github-owner>/task-management-user-service:<tag>|ghcr.io/${OWNER}/task-management-user-service:${SHA}|g" k8s/user-deployment.yaml

          sed -i "s|ghcr.io/<github-owner>/task-management-task-service:<tag>|ghcr.io/${OWNER}/task-management-task-service:${SHA}|g" k8s/task-deployment.yaml

          sed -i "s|ghcr.io/<github-owner>/task-management-frontend:<tag>|ghcr.io/${OWNER}/task-management-frontend:${SHA}|g" k8s/frontend-deployment.yaml

      - name: Show updated images
        run: |
          grep -R "image: ghcr.io" k8s/

      - name: Commit and push manifest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/

          if git diff --cached --quiet; then
            echo "No Kubernetes manifest changes to commit."
            exit 0
          fi

          git commit -m "Update Kubernetes images to ${GITHUB_SHA} [skip ci]"
          git push